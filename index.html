<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#4a3026" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Row Echelon" />
    <title>Row Echelon</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
    <link rel="stylesheet" href="styles.css?v=9" />
  </head>
  <body>
    <main class="game-shell" aria-label="Row Echelon game">
      <div class="top-glow" aria-hidden="true"></div>
      <button id="settings-button" class="settings-button" type="button" aria-expanded="false">
        SET
      </button>

      <section id="settings-panel" class="settings-panel" aria-label="Settings" hidden>
        <p class="eyebrow">INPUT</p>
        <div class="input-mode-grid">
          <button class="input-mode-button" type="button" data-input-mode="keyboard">Keyboard</button>
          <button class="input-mode-button" type="button" data-input-mode="keypad">Keypad</button>
          <button class="input-mode-button" type="button" data-input-mode="radial">Radial</button>
        </div>
      </section>

      <header class="hud">
        <span id="current-score">STEPS 0</span>
        <span id="best-score">BEST --</span>
      </header>

      <section class="title-block">
        <h1>Row Echelon</h1>
        <p id="level-label">LEVEL 1</p>
      </section>

      <section id="matrix-stage" class="matrix-stage" aria-label="Augmented matrix">
        <div id="matrix" class="matrix"></div>
        <div id="sparkle-layer" class="sparkle-layer" aria-hidden="true"></div>
      </section>

      <section class="control-card" aria-label="Row operations">
        <p class="eyebrow">ROW OPERATION</p>
        <div class="operation-grid">
          <button class="operation-button" type="button" data-mode="swap">Swap</button>
          <button class="operation-button active" type="button" data-mode="add">Add</button>
          <button class="operation-button" type="button" data-mode="scale">Scale</button>
        </div>
        <div class="factor-line">
          <label class="eyebrow" for="factor-input">FACTOR</label>
          <button id="sign-toggle-button" class="sign-toggle-button" type="button" aria-label="Toggle factor sign">
            +/-
          </button>
          <input
            id="factor-input"
            class="factor-input"
            name="factor"
            value="-1"
            inputmode="text"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            aria-label="Factor"
          />
        </div>

        <div id="numeric-tools" class="numeric-tools" hidden>
          <div class="edit-controls" aria-label="Edit factor">
            <button id="backspace-button" class="edit-button" type="button">BACK</button>
            <button id="clear-button" class="edit-button" type="button">CLEAR</button>
          </div>

          <section id="keypad-panel" class="input-panel keypad-panel" aria-label="Phone keypad" hidden>
            <div class="keypad-grid">
              <button class="keypad-button" type="button" data-digit="1">1</button>
              <button class="keypad-button" type="button" data-digit="2">2</button>
              <button class="keypad-button" type="button" data-digit="3">3</button>
              <button class="keypad-button" type="button" data-digit="4">4</button>
              <button class="keypad-button" type="button" data-digit="5">5</button>
              <button class="keypad-button" type="button" data-digit="6">6</button>
              <button class="keypad-button" type="button" data-digit="7">7</button>
              <button class="keypad-button" type="button" data-digit="8">8</button>
              <button class="keypad-button" type="button" data-digit="9">9</button>
              <button class="keypad-button zero" type="button" data-digit="0">0</button>
            </div>
          </section>

          <section id="radial-panel" class="input-panel radial-panel" aria-label="Radial dial" hidden>
            <div id="radial-dial" class="radial-dial" aria-label="Radial digit selector">
              <span class="radial-pointer" aria-hidden="true"></span>
              <span class="radial-digit" data-digit="0" style="--angle: 0deg">0</span>
              <span class="radial-digit" data-digit="1" style="--angle: 36deg">1</span>
              <span class="radial-digit" data-digit="2" style="--angle: 72deg">2</span>
              <span class="radial-digit" data-digit="3" style="--angle: 108deg">3</span>
              <span class="radial-digit" data-digit="4" style="--angle: 144deg">4</span>
              <span class="radial-digit" data-digit="5" style="--angle: 180deg">5</span>
              <span class="radial-digit" data-digit="6" style="--angle: 216deg">6</span>
              <span class="radial-digit" data-digit="7" style="--angle: 252deg">7</span>
              <span class="radial-digit" data-digit="8" style="--angle: 288deg">8</span>
              <span class="radial-digit" data-digit="9" style="--angle: 324deg">9</span>
              <span class="radial-center" aria-hidden="true"></span>
            </div>
          </section>
        </div>
      </section>

      <p id="level-cleared" class="level-cleared" aria-live="polite"></p>
      <span class="version-label" aria-label="Version">v11</span>
      <button id="reset-button" class="reset-button" type="button">RESET</button>
    </main>

    <script src="app.js?v=7" defer></script>
  </body>
</html>
