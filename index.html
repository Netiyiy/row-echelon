<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#4a3026" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Row Echelon" />
    <title>Row Echelon</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
    <link rel="stylesheet" href="styles.css?v=13" />
  </head>
  <body>
    <main class="game-shell" aria-label="Row Echelon game">
      <div class="top-glow" aria-hidden="true"></div>

      <section id="account-gate" class="account-gate" aria-label="Create player account">
        <div class="account-card">
          <p class="eyebrow">PLAYER ACCOUNT</p>
          <h2>Choose Your Name</h2>
          <p class="account-copy">Create a player to compete on today&apos;s leaderboard.</p>
          <input
            id="player-name-input"
            class="player-name-input"
            name="player-name"
            maxlength="18"
            autocomplete="nickname"
            autocapitalize="words"
            spellcheck="false"
            placeholder="Player name"
            aria-label="Player name"
          />
          <button id="create-account-button" class="create-account-button" type="button">
            START
          </button>
          <p id="account-message" class="account-message" aria-live="polite"></p>
        </div>
      </section>

      <header class="hud">
        <span id="current-score">STEPS 0</span>
        <span id="best-score">BEST --</span>
      </header>

      <section class="title-block">
        <h1>Row Echelon</h1>
        <p id="level-label">LEVEL 1</p>
      </section>

      <section id="matrix-stage" class="matrix-stage" aria-label="Augmented matrix">
        <div id="matrix" class="matrix"></div>
        <div id="sparkle-layer" class="sparkle-layer" aria-hidden="true"></div>
      </section>

      <section class="control-card" aria-label="Row operations">
        <p class="eyebrow">ROW OPERATION</p>
        <div class="operation-grid">
          <button class="operation-button" type="button" data-mode="swap">Swap</button>
          <button class="operation-button active" type="button" data-mode="add">Add</button>
          <button class="operation-button" type="button" data-mode="scale">Scale</button>
        </div>
        <div class="factor-line">
          <label class="eyebrow" for="factor-input">FACTOR</label>
          <input
            id="factor-input"
            class="factor-input"
            name="factor"
            value="-1"
            inputmode="text"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            aria-label="Factor"
          />
        </div>
      </section>

      <section id="leaderboard-card" class="leaderboard-card" aria-label="Daily leaderboard" hidden>
        <div class="leaderboard-heading">
          <p class="eyebrow">DAILY LEADERBOARD</p>
          <span id="player-label" class="player-label">NO PLAYER</span>
        </div>
        <p id="leaderboard-date" class="leaderboard-date">TODAY</p>
        <ol id="leaderboard-list" class="leaderboard-list"></ol>
        <p id="leaderboard-message" class="leaderboard-message" aria-live="polite"></p>
        <div id="leaderboard-confetti" class="leaderboard-confetti" aria-hidden="true"></div>
      </section>

      <p id="level-cleared" class="level-cleared" aria-live="polite"></p>
      <span class="version-label" aria-label="Version">v15</span>
      <button id="reset-button" class="reset-button" type="button">RESET</button>
    </main>

    <script src="app.js?v=11" defer></script>
  </body>
</html>
